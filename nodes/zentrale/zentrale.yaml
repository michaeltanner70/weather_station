# Zentrale
# Board: vorläufig generisches ESP32 (esp32dev), Hardware noch offen.
# Empfängt später die LoRa-Pakete und liest die Kabel-Sensoren.

substitutions:
  name: zentrale
  friendly_name: Zentrale

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  project:
    name: weather_station.zentrale
    version: "0.1.0"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key_zentrale

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
