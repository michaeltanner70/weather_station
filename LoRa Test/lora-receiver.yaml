# LoRa-Prototyp – Empfänger
# Board: TTGO LoRa32 V1.0 (SX1276 868 MHz, SSD1306 OLED)
# Empfängt die Dummy-Wetterdaten, zeigt Werte + Funkstatus auf dem OLED.

substitutions:
  name: lora-receiver
  friendly_name: LoRa Receiver

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: ttgo-lora32-v1
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key_receiver

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------
# Funk: integrierter SX1276 (TTGO LoRa32 V1.0)
# SCK 5, MISO 19, MOSI 27, CS 18, RST 14, DIO0 26
# ---------------------------------------------------------------
spi:
  clk_pin: GPIO5
  miso_pin: GPIO19
  mosi_pin: GPIO27

sx127x:
  cs_pin: GPIO18
  rst_pin: GPIO14
  dio0_pin: GPIO26
  modulation: LORA
  frequency: 868100000
  bandwidth: 125_0kHz
  spreading_factor: 9
  coding_rate: CR_4_5
  preamble_size: 8
  crc_enable: true
  pa_pin: BOOST
  pa_power: 14
  rx_start: true
  on_packet:
    then:
      - lambda: |-
          id(last_rx_ms) = millis();
          id(rx_count) += 1;
          id(lora_rssi).publish_state(rssi);
          id(lora_snr).publish_state(snr);
          ESP_LOGI("lora", "Paket: %u Bytes, RSSI %.0f dBm, SNR %.1f dB",
                   (unsigned) x.size(), rssi, snr);
      - output.turn_on: led
      - delay: 80ms
      - output.turn_off: led

packet_transport:
  - platform: sx127x
    providers:
      - name: lora-sender
        encryption: !secret lora_key

# ---------------------------------------------------------------
# Status
# ---------------------------------------------------------------
globals:
  - id: last_rx_ms
    type: uint32_t
    initial_value: "0"
  - id: rx_count
    type: uint32_t
    initial_value: "0"
  - id: lost_count
    type: uint32_t
    initial_value: "0"
  - id: last_seq
    type: uint32_t
    initial_value: "0"

output:
  - platform: gpio
    pin: GPIO2
    id: led

# ---------------------------------------------------------------
# Empfangene Werte (remote_id = broadcast_id im Sender)
# ---------------------------------------------------------------
sensor:
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: t
    id: temperature
    name: "Temperatur"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: h
    id: humidity
    name: "Feuchte"
    unit_of_measurement: "%"
    accuracy_decimals: 0
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: p
    id: pressure
    name: "Luftdruck"
    unit_of_measurement: "hPa"
    accuracy_decimals: 1
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: ws
    id: wind_speed
    name: "Wind"
    unit_of_measurement: "m/s"
    accuracy_decimals: 1
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: wd
    id: wind_dir
    name: "Windrichtung"
    unit_of_measurement: "°"
    accuracy_decimals: 0
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: r
    id: rain
    name: "Regen total"
    unit_of_measurement: "mm"
    accuracy_decimals: 1
  - platform: packet_transport
    provider: lora-sender
    internal: false
    remote_id: n
    id: seq
    name: "Sequenz"
    accuracy_decimals: 0
    on_value:
      then:
        - lambda: |-
            uint32_t s = (uint32_t) x;
            uint32_t last = id(last_seq);
            if (last > 0 && s > last + 1) {
              id(lost_count) += s - last - 1;
              ESP_LOGW("lora", "%u Paket(e) verloren", (unsigned)(s - last - 1));
            }
            // s <= last: Sender neu gestartet -> Zähler neu aufsetzen
            id(last_seq) = s;

  # Funkstatus
  - platform: template
    id: lora_rssi
    name: "LoRa RSSI"
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: lora_snr
    name: "LoRa SNR"
    unit_of_measurement: "dB"
    accuracy_decimals: 1
    update_interval: never

# ---------------------------------------------------------------
# OLED SSD1306 128x64: SDA 4, SCL 15, RST 16
# ---------------------------------------------------------------
i2c:
  sda: GPIO4
  scl: GPIO15

font:
  - file: "gfonts://Roboto Mono"
    id: f_small
    size: 10
  - file:
      type: gfonts
      family: Roboto Mono
      weight: 700
    id: f_bold
    size: 11

display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    reset_pin: GPIO16
    id: oled
    update_interval: 1s
    pages:
      - id: page_values
        lambda: |-
          it.print(0, 0, id(f_bold), "Wetter (Dummy)");
          if (!id(temperature).has_state()) {
            it.print(0, 26, id(f_small), "warte auf Daten...");
            return;
          }
          it.printf(0, 14, id(f_small), "T %5.1f C  H %3.0f%%",
                    id(temperature).state, id(humidity).state);
          it.printf(0, 26, id(f_small), "P %6.1f hPa", id(pressure).state);
          it.printf(0, 38, id(f_small), "W %4.1f m/s %3.0f",
                    id(wind_speed).state, id(wind_dir).state);
          it.printf(0, 50, id(f_small), "R %5.1f mm", id(rain).state);

      - id: page_radio
        lambda: |-
          it.print(0, 0, id(f_bold), "Funk 868.1 SF9");
          if (id(rx_count) == 0) {
            it.print(0, 26, id(f_small), "noch kein Paket");
            return;
          }
          uint32_t age = (millis() - id(last_rx_ms)) / 1000;
          it.printf(0, 14, id(f_small), "RSSI %4.0f dBm", id(lora_rssi).state);
          it.printf(0, 26, id(f_small), "SNR  %4.1f dB", id(lora_snr).state);
          it.printf(0, 38, id(f_small), "Alter %u s%s",
                    (unsigned) age, age > 150 ? " !!" : "");
          it.printf(0, 50, id(f_small), "Rx %u  Verl %u",
                    (unsigned) id(rx_count), (unsigned) id(lost_count));

# Seitenwechsel automatisch alle 5 s, Taster (GPIO0) schaltet manuell weiter
interval:
  - interval: 5s
    then:
      - display.page.show_next: oled
      - component.update: oled

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
    id: btn_page
    internal: true
    on_press:
      - display.page.show_next: oled
      - component.update: oled
